<section class="container">
  <form class="card form-card" (ngSubmit)="submit()">
    <h1>Redefinir senha</h1>
    <p class="text-muted">Cole o código de redefinição recebido e escolha uma nova senha.</p>

    @if (error()) {
      <p class="alert alert-danger">{{ error() }}</p>
    }
    @if (success()) {
      <p class="alert alert-ok">Senha redefinida! Redirecionando para o login…</p>
    }

    <div class="field">
      <label for="token">Código de redefinição</label>
      <input id="token" name="token" type="text" [(ngModel)]="token" required placeholder="Cole aqui o código recebido" />
    </div>

    <div class="field">
      <label for="newPassword">Nova senha</label>
      <input
        id="newPassword"
        name="newPassword"
        type="password"
        [(ngModel)]="newPassword"
        required
        minlength="6"
        autocomplete="new-password"
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar nova senha</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        required
        autocomplete="new-password"
        placeholder="Repita a nova senha"
      />
      @if (passwordsMismatch) {
        <span class="field-error">As senhas não coincidem.</span>
      }
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loading() || passwordsMismatch">
      {{ loading() ? 'Salvando…' : 'Redefinir senha' }}
    </button>

    <p class="form-links">
      <a routerLink="/login">Voltar para o login</a>
      <span></span>
    </p>
  </form>
</section>
